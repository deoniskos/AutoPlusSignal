name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate Android project
        shell: bash
        run: |
          cat bundle.part1 bundle.part2 bundle.part3 bundle.part4 bundle.part5 > project.zip.b64
          base64 -d project.zip.b64 > project.zip
          unzip -q project.zip
          rm project.zip project.zip.b64

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: AutoPlusSignal
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlusSignal-debug-apk
          path: AutoPlusSignal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
