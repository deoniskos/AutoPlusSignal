plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.autoplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.deoniskos.autoplussignal"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
