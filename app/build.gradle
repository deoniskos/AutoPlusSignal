plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.autoplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.deoniskos.autoplussignal"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "0.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
